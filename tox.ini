[tox]
envlist = py314,ruff-check
minversion = 4.0
skip_missing_interpreters = true

[testenv]
runner = uv-venv-lock-runner
extras =
  test
passenv =
  PATH
commands =
  pytest {posargs} exordos_image_format/tests

[testenv:ruff-check]
extras =
  ruff
commands =
  ruff check .
  ruff format --check .

[testenv:ruff]
extras =
  ruff
commands =
  ruff check . --fix
  ruff check --select I --fix .
  ruff format .
